<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>FlipLoop asset generator</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #root { position: absolute; inset: 0; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  // Renders one asset at the window size; headless Chrome screenshots it.
  // ?type=icon (manifest "any": rounded tile, transparent corners), ?type=maskable (full-bleed Desk,
  // glyph inside the central 80% safe zone), ?type=og (1200x630), ?type=favicon,
  // ?type=apple (180x180 apple-touch-icon: full-bleed Desk, square and fully opaque, with the glyph
  // as large as in "icon". iOS cuts the corners itself and paints any transparency black, so a
  // rounded tile with transparent corners shows dark slivers on the home screen.)
  import { lightTableSvg } from "../site/js/screens/home-art.js";
  const type = new URLSearchParams(location.search).get("type") || "icon";
  const root = document.getElementById("root");
  const rounded = type === "favicon" || type === "icon";
  const glyph = (inset) => `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
      <rect width="100" height="100" fill="#DAD6CC" rx="${rounded ? 18 : 0}"/>
      <g transform="translate(50 50) scale(${inset}) translate(-50 -50)" fill="none" stroke="#1F1E1B" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="21" y="35" width="62" height="38" rx="3" fill="#F6F3EC" stroke-width="3"/>
        <rect x="18.5" y="32.5" width="62" height="38" rx="3" fill="#FFFFFF" stroke-width="3"/>
        <rect x="16" y="30" width="62" height="38" rx="3" fill="#FFFFFF"/>
        <path d="M28.5 30.2v37.6" stroke-width="3"/>
        <circle cx="22.3" cy="38.5" r="1.9" fill="#1F1E1B" stroke="none"/>
        <circle cx="22.3" cy="59.6" r="1.9" fill="#1F1E1B" stroke="none"/>
        <circle cx="49" cy="44" r="6.2"/>
        <path d="M44.6 62.5c.6-6.8 2.4-10.3 4.4-10.3s3.9 3.5 4.5 10.3"/>
        <path d="M52.8 55.2l6.8-5.4 3.4-6.6"/>
      </g>
    </svg>`;
  if (type === "og") {
    root.style.background = "#DAD6CC";
    root.innerHTML = `<div style="width:780px">${lightTableSvg()}</div>`;
    // Home light table with the flipbook on frame 4 (arm up), centred on Desk, no text.
  } else if (rounded || type === "apple") {
    root.innerHTML = glyph(1.18);
  } else {
    root.innerHTML = glyph(0.8 * 1.18);
  }
  document.body.dataset.ready = "1";
</script>
</body>
</html>
